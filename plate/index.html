<!doctype html><html><head><meta charset="utf-8"><style>
body{font:13px system-ui;color:#18334a;margin:0;background:#fff}.toolbar{display:flex;gap:12px;align-items:center;margin:8px 5px;flex-wrap:wrap}#plate{display:grid;grid-template-columns:30px repeat(12,minmax(68px,1fr));gap:5px;min-width:940px;user-select:none;touch-action:none}.wrap{overflow-x:auto;padding:6px}button{font:inherit;min-height:65px;border:1px solid #cbd5e1;border-radius:9px;background:#f4f7fa;text-align:left;padding:6px;cursor:crosshair;color:inherit}button b{display:block;font-size:11px;margin-bottom:5px}button span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:95px;pointer-events:none}.Sample{background:#dbeafe}.ladder{background:#ede1ff}.positive{background:#d5f5e3}.negative{background:#ffead1}.selected{outline:3px solid #2563eb;outline-offset:-3px;cursor:grab}.target{box-shadow:inset 0 0 0 3px #16a34a}.blocked{box-shadow:inset 0 0 0 3px #dc2626}.label{text-align:center;align-self:center}.legend{margin:12px 6px;color:#475569}body.moving button{cursor:grabbing}
</style></head><body><div class="toolbar"><strong id="count">0 selected</strong><span>Hold left mouse and drag across wells to select. Drag from a selected sample to move the group.</span></div><div class="wrap"><div id="plate"></div></div><div class="legend">Blue: sample · Purple: ladder · Green: positive control · Orange: negative control · Gray: empty. Click an empty well or press Escape to clear selection.</div><div id="detail" role="status"></div><script>
let samples={},selected=new Set(),gesture=null;
function send(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function coords(w){return [w.charCodeAt(0)-65,Number(w.slice(1))-1]}
function mark(){document.querySelectorAll('[data-well]').forEach(b=>{b.classList.toggle('selected',selected.has(b.dataset.well));b.setAttribute('aria-pressed',String(selected.has(b.dataset.well)))});document.getElementById('count').textContent=selected.size+' selected'}
function clearPreview(){document.querySelectorAll('.target,.blocked').forEach(b=>b.classList.remove('target','blocked'))}
function rectangle(start,end,base){const [r1,c1]=coords(start),[r2,c2]=coords(end);selected=new Set(base);Object.keys(samples).forEach(w=>{const [r,c]=coords(w);if(r>=Math.min(r1,r2)&&r<=Math.max(r1,r2)&&c>=Math.min(c1,c2)&&c<=Math.max(c1,c2))selected.add(w)});mark()}
function targets(anchor,destination){const [ar,ac]=coords(anchor),[dr,dc]=coords(destination);let valid=true;const wells=[];for(const w of selected){const [r,c]=coords(w),nr=r+dr-ar,nc=c+dc-ac;if(nr<0||nr>7||nc<0||nc>11){valid=false;continue}const target=String.fromCharCode(65+nr)+String(nc+1).padStart(2,'0');wells.push(target);if(selected.size>1&&samples[target]&&!selected.has(target))valid=false}return {valid,wells}}
function begin(e,well){if(e.button!==0)return;e.preventDefault();if(e.ctrlKey||e.metaKey){if(samples[well]){selected.has(well)?selected.delete(well):selected.add(well)}mark();return}const moving=selected.has(well)&&!!samples[well];gesture={kind:moving?'move':'select',anchor:well,end:well,x:e.clientX,y:e.clientY,moved:false};if(!moving)rectangle(well,well,[]);document.body.classList.toggle('moving',moving);e.currentTarget.setPointerCapture(e.pointerId);document.getElementById('detail').textContent=well+' — '+(samples[well]?.SampleName||'Empty')}
function track(e){if(!gesture)return;if(Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>4)gesture.moved=true;const b=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-well]');gesture.end=b?.dataset.well||null;clearPreview();if(!gesture.end)return;if(gesture.kind==='select')rectangle(gesture.anchor,gesture.end,[]);else{const plan=targets(gesture.anchor,gesture.end);for(const w of plan.wells){document.querySelector('[data-well="'+w+'"]').classList.add(plan.valid?'target':'blocked')}document.getElementById('detail').textContent=plan.valid?'Release to move selection.':'Group must fit inside the plate without overlapping unselected samples.'}}
function finish(e){if(!gesture)return;track(e);const g=gesture;gesture=null;document.body.classList.remove('moving');clearPreview();if(g.kind==='move'&&g.moved&&g.end&&g.end!==g.anchor){const plan=targets(g.anchor,g.end);if(plan.valid){send('streamlit:setComponentValue',{value:{id:crypto.randomUUID(),source:g.anchor,destination:g.end,sources:[...selected]},dataType:'json'});selected.clear();mark()}}}
function draw(){selected=new Set([...selected].filter(w=>samples[w]));const grid=document.getElementById('plate');grid.replaceChildren();for(let c=0;c<=12;c++){const el=document.createElement('div');el.className='label';el.textContent=c||'';grid.append(el)}for(const r of 'ABCDEFGH'){const label=document.createElement('div');label.className='label';label.textContent=r;grid.append(label);for(let c=1;c<=12;c++){const well=r+String(c).padStart(2,'0'),sample=samples[well],b=document.createElement('button');b.dataset.well=well;b.type='button';const title=document.createElement('b');title.textContent=well;b.append(title);const name=document.createElement('span');name.textContent=sample?.SampleName||'Empty';b.append(name);b.title=well+' — '+(sample?.SampleName||'Empty')+' '+(sample?.SampleType||'');b.setAttribute('aria-label',b.title);if(sample){const t=sample.SampleType;b.className=t==='Allelic Ladder'?'ladder':t==='Positive Control'?'positive':t==='Negative Control'?'negative':'Sample'}b.draggable=false;b.onpointerdown=e=>begin(e,well);b.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(sample){selected.has(well)?selected.delete(well):selected.add(well)}else selected.clear();mark()}};grid.append(b)}}mark();send('streamlit:setFrameHeight',{height:730})}
document.addEventListener('pointermove',track);document.addEventListener('pointerup',finish);document.addEventListener('pointercancel',()=>{gesture=null;clearPreview();document.body.classList.remove('moving')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){selected.clear();gesture=null;clearPreview();mark();document.body.classList.remove('moving')}});window.addEventListener('message',e=>{if(e.source===parent&&e.data.type==='streamlit:render'){samples=e.data.args.samples;gesture=null;draw()}});send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
